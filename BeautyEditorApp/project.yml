name: BeautyEditor
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "17.0"
packages:
  BeautySDK:
    path: ../BeautySDK
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: UHKD6CZHH3
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0
targets:
  BeautyEditor:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: BeautySDK
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yakang.wanneng1
        "PRODUCT_BUNDLE_IDENTIFIER[sdk=iphonesimulator*]": com.yakang.beautyeditor.local
        INFOPLIST_KEY_CFBundleDisplayName: 美颜编辑器
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: 美颜编辑器
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Light
        UIViewControllerBasedStatusBarAppearance: false
        UIStatusBarStyle: UIStatusBarStyleLightContent
        NSPhotoLibraryAddUsageDescription: 仅在你点击保存时，将编辑后的图片写入相册。
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
  BeautyEditorTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: BeautyEditor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yakang.beautyeditor.tests
        GENERATE_INFOPLIST_FILE: YES
  BeautyEditorUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: BeautyEditor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yakang.beautyeditor.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  BeautyEditor:
    build:
      targets:
        BeautyEditor: all
        BeautyEditorTests: [test]
        BeautyEditorUITests: [test]
    test:
      gatherCoverageData: false
      targets:
        - name: BeautyEditorTests
          parallelizable: false
        - name: BeautyEditorUITests
          parallelizable: false
