<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>美图秀秀 Home HTML Reference</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <section id="home-first-screen" class="capture-section" aria-label="Home first screen">
      <div class="phone-frame home-shell">
        <header class="home-hero">
          <div class="home-top-chrome">
            <div class="search-pill"><span>⌕</span><span>搜索</span></div>
            <div class="brand-capsule">美图秀秀</div>
            <div class="vip-chip">♥</div>
          </div>

          <div class="hero-body">
            <h1 class="hero-title">复古胶片相机</h1>
            <div class="hero-subtitle">不去建模 - 拍出氛围感照片</div>
            <div class="film-card" aria-hidden="true"></div>
            <div class="cta-orange">拍一拍</div>
          </div>
        </header>

        <section class="primary-actions" aria-label="Primary actions">
          <div class="action-grid large">
            <div class="action-card large"><span class="line-icon"></span><span>图片美化</span></div>
            <div class="action-card large"><span class="line-icon"></span><span>修视频</span></div>
          </div>
          <div class="action-grid small">
            <div class="action-card small"><span class="line-icon"></span><span>人像美容</span></div>
            <div class="action-card small"><span class="line-icon"></span><span>拼图</span></div>
            <div class="action-card small"><span class="line-icon"></span><span>相机</span></div>
            <div class="action-card small"><span class="line-icon"></span><span>视频美容</span></div>
          </div>
        </section>

        <section class="tool-pages" aria-label="Paged tools">
          <div id="home-tool-page-1" class="tool-page" aria-label="Tool page 1">
            <div class="tool-item"><span class="badge">New</span><span class="tool-icon"></span><span>脑洞特效</span></div>
            <div class="tool-item"><span class="tool-icon"></span><span>AI合照</span></div>
            <div class="tool-item"><span class="tool-icon"></span><span>画质修复</span></div>
            <div class="tool-item"><span class="tool-icon"></span><span>视频消除</span></div>
            <div class="tool-item"><span class="tool-icon"></span><span>苹果模式</span></div>
            <div class="tool-item"><span class="badge">Agent</span><span class="tool-icon"></span><span>AI改图</span></div>
            <div class="tool-item"><span class="tool-icon"></span><span>无缝拼图</span></div>
            <div class="tool-item"><span class="badge">Hot</span><span class="tool-icon"></span><span>证件照</span></div>
          </div>
          <div class="page-dots"><span class="active"></span><span></span><span></span></div>
        </section>

        <section class="recommendations" aria-label="Recommendations">
          <div class="recommendation-section">
            <h2 class="section-title">欧美闪光滤镜</h2>
            <div class="card-rail">
              <div class="image-card" style="--top:#4b3d39;--bottom:#b9836b"></div>
              <div class="image-card" style="--top:#2a4858;--bottom:#d1b07d"></div>
              <div class="image-card" style="--top:#1e2c2f;--bottom:#b8898a"></div>
              <div class="image-card" style="--top:#6d5246;--bottom:#d7b48c"></div>
            </div>
          </div>
        </section>

        <nav class="bottom-tabs" aria-label="Bottom tabs">
          <div class="bottom-tab active">首页</div>
          <div class="bottom-tab">图库</div>
          <div class="bottom-tab">AI 修图</div>
          <div class="bottom-tab dot">我</div>
        </nav>
      </div>
    </section>

    <section class="capture-section" aria-label="Home tool pages">
      <div class="phone-frame home-shell compact-state">
        <div class="tool-pages tool-pages-expanded">
          <div id="home-tool-page-2" class="tool-page" aria-label="Tool page 2">
            <div class="tool-item"><span class="badge">AI</span><span class="tool-icon"></span><span>AI舞蹈</span></div>
            <div class="tool-item"><span class="tool-icon"></span><span>创意玩法</span></div>
            <div class="tool-item"><span class="badge">AI</span><span class="tool-icon"></span><span>AI扩图</span></div>
            <div class="tool-item"><span class="tool-icon"></span><span>AI形象照</span></div>
            <div class="tool-item"><span class="tool-icon"></span><span>修Live</span></div>
            <div class="tool-item"><span class="tool-icon"></span><span>闪光灯</span></div>
            <div class="tool-item"><span class="tool-icon"></span><span>批量修图</span></div>
            <div class="tool-item"><span class="badge">AI</span><span class="tool-icon"></span><span>AI消除</span></div>
            <div class="tool-item"><span class="tool-icon"></span><span>设计室</span></div>
            <div class="tool-item"><span class="tool-icon"></span><span>闪传相册</span></div>
            <div class="tool-item"><span class="badge">AI</span><span class="tool-icon"></span><span>AI发型</span></div>
            <div class="tool-item"><span class="badge">AI</span><span class="tool-icon"></span><span>AI写真</span></div>
          </div>
          <div class="page-dots"><span></span><span class="active"></span><span></span></div>

          <div id="home-tool-page-3" class="tool-page single-tool" aria-label="Tool page 3">
            <div class="tool-item"><span class="tool-icon"></span><span>智能抠图</span></div>
          </div>
          <div class="page-dots"><span></span><span></span><span class="active"></span></div>
        </div>
      </div>
    </section>

    <section id="home-sticky-state" class="capture-section" aria-label="Home sticky state">
      <div class="phone-frame home-shell">
        <div class="sticky-shortcuts">
          <div class="sticky-drop"></div>
          <div class="sticky-card">图片美化</div>
          <div class="sticky-card">修视频</div>
          <div class="sticky-card">人像美容</div>
          <div class="sticky-card">拼图</div>
          <div class="sticky-card">相机</div>
          <div class="sticky-card">视频美容</div>
        </div>

        <section class="recommendations sticky-recommendations" aria-label="Sticky recommendations">
          <div class="recommendation-section">
            <h2 class="section-title">欧美闪光滤镜</h2>
            <div class="card-rail">
              <div class="image-card" style="--top:#4b3d39;--bottom:#b9836b"></div>
              <div class="image-card" style="--top:#2a4858;--bottom:#d1b07d"></div>
              <div class="image-card" style="--top:#1e2c2f;--bottom:#b8898a"></div>
            </div>
          </div>
          <div class="recommendation-section">
            <h2 class="section-title">不能错过热门玩法</h2>
            <div class="card-rail">
              <div class="image-card" style="--top:#33483f;--bottom:#c06973"></div>
              <div class="image-card" style="--top:#233b59;--bottom:#7c9bc0"></div>
              <div class="image-card" style="--top:#523a4c;--bottom:#dfa4b3"></div>
            </div>
          </div>
          <div class="recommendation-section">
            <h2 class="section-title">欧美曲线塑形</h2>
            <div class="card-rail">
              <div class="image-card" style="--top:#262f2b;--bottom:#cfa36a"></div>
              <div class="image-card" style="--top:#473b4f;--bottom:#ba90d4"></div>
              <div class="image-card" style="--top:#2d4357;--bottom:#a4c2d8"></div>
            </div>
          </div>
          <div class="recommendation-section">
            <h2 class="section-title">欧美美容常态</h2>
            <div class="card-rail">
              <div class="image-card" style="--top:#3f2c35;--bottom:#d7a4a5"></div>
              <div class="image-card" style="--top:#20333d;--bottom:#93b8c7"></div>
              <div class="image-card" style="--top:#4b4839;--bottom:#d6d0a4"></div>
            </div>
          </div>
        </section>

        <nav class="bottom-tabs" aria-label="Bottom tabs sticky">
          <div class="bottom-tab active">首页</div>
          <div class="bottom-tab">图库</div>
          <div class="bottom-tab">AI 修图</div>
          <div class="bottom-tab dot">我</div>
        </nav>
      </div>
    </section>
  </main>
</body>
</html>
