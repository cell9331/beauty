<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>美图秀秀 Editor HTML Reference</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <section id="editor-tool-panel" class="capture-section" aria-label="Editor tool panel">
      <div class="phone-frame editor">
        <header class="editor-top">
          <div class="brand-capsule">美图秀秀</div>
        </header>

        <section class="preview-region" aria-label="Portrait preview">
          <div class="preview-controls">
            <div class="switch-chip"><span>○</span><span>背景保护</span></div>
            <div class="preview-chip">对比</div>
          </div>
        </section>

        <section class="editor-panel" aria-label="美型 tool panel">
          <div class="slider-row">
            <div class="slider-track"><span class="slider-thumb"></span></div>
            <div class="whole-pill">整体</div>
          </div>

          <div class="editor-tool-row tool-rail" aria-label="Second-level tools">
            <div class="editor-tool selected"><span class="badge">限免</span><span class="circle-icon"></span><span>对称</span></div>
            <div class="editor-tool"><span class="circle-icon"></span><span>上下</span></div>
            <div class="editor-tool"><span class="circle-icon"></span><span>左右</span></div>
            <div class="editor-tool"><span class="circle-icon"></span><span>倾斜</span></div>
            <div class="editor-tool"><span class="circle-icon"></span><span>小头</span></div>
            <div class="editor-tool"><span class="circle-icon"></span><span>头包脸</span></div>
            <div class="editor-tool"><span class="circle-icon"></span><span>脸宽</span></div>
            <div class="editor-tool"><span class="circle-icon"></span><span>小脸</span></div>
            <div class="editor-tool"><span class="circle-icon"></span><span>面部流畅</span></div>
            <div class="editor-tool"><span class="circle-icon"></span><span>大小</span></div>
            <div class="editor-tool"><span class="circle-icon"></span><span>眼距</span></div>
            <div class="editor-tool"><span class="badge">限免</span><span class="circle-icon"></span><span>M唇</span></div>
            <div class="editor-tool"><span class="circle-icon"></span><span>丰唇</span></div>
            <div class="editor-tool"><span class="circle-icon"></span><span>鼻翼</span></div>
            <div class="editor-tool"><span class="circle-icon"></span><span>鼻尖</span></div>
            <div class="editor-tool"><span class="badge off">OFF</span><span class="circle-icon"></span><span>上下</span></div>
            <div class="editor-tool"><span class="circle-icon"></span><span>粗细</span></div>
            <div class="editor-tool"><span class="circle-icon"></span><span>眉峰</span></div>
            <div class="editor-tool"><span class="badge pro">Pro</span><span class="circle-icon"></span><span>去双下巴</span></div>
          </div>

          <nav class="editor-categories category-rail" aria-label="First-level categories">
            <div class="editor-category active">3D塑颜</div>
            <div class="editor-category">比例</div>
            <div class="editor-category">脸型</div>
            <div class="editor-category">眼睛</div>
            <div class="editor-category">嘴唇</div>
            <div class="editor-category">鼻子</div>
            <div class="editor-category">眉毛</div>
          </nav>

          <div class="editor-actions" aria-label="Editor actions">
            <div aria-label="取消">×</div>
            <div aria-label="确认">✓</div>
          </div>
        </section>
      </div>
    </section>
  </main>
</body>
</html>
